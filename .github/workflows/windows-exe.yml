name: Build Windows Roost.exe
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "server.py"
      - "launcher.py"
      - "static/**"
      - "requirements.txt"
      - ".github/workflows/windows-exe.yml"
jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Build single-file app
        run: pyinstaller --noconfirm --clean --onefile --windowed --name Roost --add-data "static;static" --collect-all tzdata --hidden-import uvicorn.logging --hidden-import uvicorn.loops.auto --hidden-import uvicorn.protocols.http.auto --hidden-import uvicorn.lifespan.on launcher.py
      - uses: actions/upload-artifact@v4
        with:
          name: Roost-Windows
          path: dist/Roost.exe
          if-no-files-found: error
